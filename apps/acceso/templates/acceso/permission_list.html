<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lista de Permisos</title>
</head>
<body>

<h1>Lista de Permisos</h1>

<a href="{% url 'acceso:permission_create' %}">
    Nuevo permiso
</a>

<table border="1">
    <thead>
    <tr>
        <th>Grupo</th>
        <th>Módulo</th>
        <th>Permiso</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    {% for permission in permissions %}
        <tr>
            <td>{{ permission.grupo }}</td>
            <td>{{ permission.modulo }}</td>
            <td>{{ permission.permiso }}</td>
            <td>
                <a href="{% url 'acceso:permission_update' permission.id %}">
                    Editar
                </a>

                <a href="{% url 'acceso:permission_delete' permission.id %}">
                    Eliminar
                </a>
            </td>
        </tr>
    {% empty %}
        <tr>
            <td colspan="4">
                No hay permisos registrados
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>

</body>
</html>
